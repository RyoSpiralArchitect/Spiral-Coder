[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spiral-coder-lite"
version = "0.1.0"
description = "WDAC-friendly Spiral-Coder Lite CLI"
readme = "docs/lite-cli.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
spiral-coder-lite = "scripts.spiral_coder_lite_cli:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts"]

